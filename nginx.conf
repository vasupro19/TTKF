# ============================================================================
#  nginx configuration for the SPA
# ============================================================================

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # ---- container health ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---- security headers ----
    # The API sets its own; these protect the HTML document itself.
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-Frame-Options          "DENY"                             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy.
    #
    # 'unsafe-inline' for style-src is required by Emotion, which MUI uses to
    # inject styles at runtime. Removing it means adopting a nonce-based setup
    # across the whole component library — worth doing, not a quick change.
    #
    # connect-src must list the API origin. It is templated at build time in a
    # real pipeline; the wildcard here is deliberately visible so it is not
    # mistaken for a finished policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ---- hashed assets: immutable, cache for a year ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|eot|png|jpe?g|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ---- index.html: never cache ----
    # A cached index.html points at asset filenames from a previous deploy,
    # which 404 after the old chunks are gone — the classic "white screen after
    # deploy" that a hard refresh appears to fix.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---- SPA fallback ----
    # Client-side routing means /process/leads has no file behind it; serve the
    # app and let react-router resolve the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps from the image.
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
}
