# ============================================================================
#  nginx configuration for the SPA
# ============================================================================

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # ---- container health ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---- security headers ----
    # Re-included in every location below that has its own add_header, or that
    # location silently drops all of them (see nginx-security-headers.conf).
    include /etc/nginx/snippets/security-headers.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ---- hashed assets: immutable, cache for a year ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|eot|png|jpe?g|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # ---- index.html: never cache ----
    # A cached index.html points at asset filenames from a previous deploy,
    # which 404 after the old chunks are gone — the classic "white screen after
    # deploy" that a hard refresh appears to fix.
    location = /index.html {
        #? no `expires -1` — it emits a second, conflicting Cache-Control: no-cache
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- SPA fallback ----
    # Client-side routing means /process/leads has no file behind it; serve the
    # app and let react-router resolve the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps from the image.
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
}
